name: CI - Testes Lanchonete

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Teste - Valor negativo
        run: node teste-valor-negativo.js

      - name: Teste - Adicionar produtos
        run: node Adicionar-produtos-lanchonete.js
